<svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>{`
      @keyframes miniPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .mini-pulse { animation: miniPulse 2s ease-in-out infinite; }
    `}</style>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="20" cy="20" r="17" stroke="#0F172A" stroke-width="1.2" opacity="0.2"/>
  
  <!-- Core V -->
  <path d="M 12 15 Q 20 28 28 15" stroke="#E11D48" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Energy pulsers -->
  <circle cx="28" cy="12" r="1.5" fill="#E11D48" opacity="0.92"/>
  <circle cx="12" cy="28" r="1.5" fill="#0F172A" opacity="0.8"/>
</svg>
