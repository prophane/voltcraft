# =================================================================
# Voltcraft — Docker Compose (local-only, no public reverse proxy)
# =================================================================
# Expose only internal ports. Public access is handled externally
# by your own reverse proxy / tunnel solution (e.g. Pangolin).
# =================================================================

services:

  # ---------------------------------------------------------------
  # PostgreSQL — primary database
  # ---------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: voltcraft-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voltcraft}
      POSTGRES_USER: ${POSTGRES_USER:-voltcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voltcraft} -d ${POSTGRES_DB:-voltcraft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # Redis — cache + BullMQ queues
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: voltcraft-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD} --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # Mosquitto — MQTT broker for Home Assistant integration
  # ---------------------------------------------------------------
  mqtt:
    image: eclipse-mosquitto:2
    container_name: voltcraft-mqtt
    restart: unless-stopped
    volumes:
      - ./infra/docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      - mqtt-logs:/mosquitto/log
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t '$$SYS/broker/uptime' -n 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # Tesla vehicle-command proxy — signs remote vehicle commands
  # ---------------------------------------------------------------
  vehicle-command:
    image: tesla/vehicle-command:latest
    container_name: voltcraft-vehicle-command
    restart: unless-stopped
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tesla/proxy-tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tesla/proxy-tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: 4443
      TESLA_HTTP_PROXY_TIMEOUT: 30s
      TESLA_KEY_FILE: /config/tesla/partner-private-key.pem
      TESLA_VERBOSE: ${TESLA_PROXY_VERBOSE:-false}
    security_opt:
      - no-new-privileges:true
    volumes:
      - app-config:/config
    expose:
      - "4443"
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # API — Fastify backend
  # ---------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: voltcraft-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vehicle-command:
        condition: service_started
    environment:
      NODE_ENV: production
      APP_CONFIG_PATH: /app/data/runtime.env
      DATABASE_URL: postgresql://${POSTGRES_USER:-voltcraft}:${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-voltcraft}
      REDIS_URL: redis://:${REDIS_PASSWORD:-CHANGE_ME_REDIS_PASSWORD}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-CHANGE_ME_SESSION_SECRET_MIN_16_CHARS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-CHANGE_ME_ENCRYPTION_KEY_MIN_16_CHARS}
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      TESLA_TOKEN: ${TESLA_TOKEN:-}
      TESLA_REGION: ${TESLA_REGION:-na}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-https://voltcraft.ph4.fr/api/auth/tesla/callback}
      TESLA_COMMAND_PROXY_URL: ${TESLA_COMMAND_PROXY_URL:-https://vehicle-command:4443}
      MQTT_ENABLED: ${MQTT_ENABLED:-false}
      MQTT_BROKER: mqtt
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      API_PORT: ${API_PORT:-3001}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${WEB_PORT:-3000}:3001"
      - "${API_PORT:-3001}:3001"
    volumes:
      - app-config:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # TeslaMate PostgreSQL — dedicated DB for TeslaMate (optional)
  # ---------------------------------------------------------------
  teslamate-db:
    image: postgres:16-alpine
    container_name: teslamate-db
    restart: unless-stopped
    profiles:
      - teslamate
    environment:
      POSTGRES_DB: ${TESLAMATE_DB_NAME:-teslamate}
      POSTGRES_USER: ${TESLAMATE_DB_USER:-teslamate}
      POSTGRES_PASSWORD: ${TESLAMATE_DB_PASSWORD:-CHANGE_ME_TESLAMATE_DB_PASSWORD}
    volumes:
      - teslamate-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TESLAMATE_DB_USER:-teslamate} -d ${TESLAMATE_DB_NAME:-teslamate}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # TeslaMate — telemetry ingestion + analytics backend (optional)
  # ---------------------------------------------------------------
  teslamate:
    image: teslamate/teslamate:latest
    container_name: teslamate
    restart: unless-stopped
    profiles:
      - teslamate
    depends_on:
      teslamate-db:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${TESLAMATE_ENCRYPTION_KEY:-CHANGE_ME_TESLAMATE_ENCRYPTION_KEY}
      DATABASE_USER: ${TESLAMATE_DB_USER:-teslamate}
      DATABASE_PASS: ${TESLAMATE_DB_PASSWORD:-CHANGE_ME_TESLAMATE_DB_PASSWORD}
      DATABASE_NAME: ${TESLAMATE_DB_NAME:-teslamate}
      DATABASE_HOST: teslamate-db
      TZ: ${TIMEZONE:-Europe/Paris}
    ports:
      - "127.0.0.1:${TESLAMATE_PORT:-4000}:4000"
    networks:
      - voltcraft-net

  # ---------------------------------------------------------------
  # TeslaMate Grafana — dashboards (optional)
  # ---------------------------------------------------------------
  teslamate-grafana:
    image: teslamate/grafana:latest
    container_name: teslamate-grafana
    restart: unless-stopped
    profiles:
      - teslamate
    depends_on:
      teslamate-db:
        condition: service_healthy
    environment:
      DATABASE_USER: ${TESLAMATE_DB_USER:-teslamate}
      DATABASE_PASS: ${TESLAMATE_DB_PASSWORD:-CHANGE_ME_TESLAMATE_DB_PASSWORD}
      DATABASE_NAME: ${TESLAMATE_DB_NAME:-teslamate}
      DATABASE_HOST: teslamate-db
      GF_SECURITY_ADMIN_USER: ${TESLAMATE_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${TESLAMATE_GRAFANA_PASSWORD:-admin}
      TZ: ${TIMEZONE:-Europe/Paris}
    ports:
      - "127.0.0.1:${TESLAMATE_GRAFANA_PORT:-3002}:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    networks:
      - voltcraft-net

# =================================================================
# Volumes
# =================================================================
volumes:
  db-data:
    name: voltcraft-db-data
  redis-data:
    name: voltcraft-redis-data
  mqtt-data:
    name: voltcraft-mqtt-data
  mqtt-logs:
    name: voltcraft-mqtt-logs
  app-config:
    name: voltcraft-app-config
  teslamate-db-data:
    name: teslamate-db-data
  teslamate-grafana-data:
    name: teslamate-grafana-data

# =================================================================
# Networks — single internal bridge, no external routing
# =================================================================
networks:
  voltcraft-net:
    name: voltcraft-net
    driver: bridge
